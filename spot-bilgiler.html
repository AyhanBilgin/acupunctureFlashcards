<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c3e50"><title>Akupunktur Spot Bilgiler</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--dark:#2c3e50;--teal:#16a085;--bg:#f5f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px 'Segoe UI',sans-serif;color:var(--dark)}main{max-width:1100px;margin:auto;padding:22px}header{text-align:center}h1{margin:10px 0}a{color:var(--teal)}.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.button,button{border:0;border-radius:9px;background:var(--teal);color:white;padding:11px 16px;cursor:pointer;font:inherit}.secondary{background:var(--dark)}.danger{background:#c0392b}.ghost{background:#e5e9ec;color:var(--dark)}input,select,textarea{font:inherit;padding:11px;border:1px solid #ccd2d8;border-radius:9px;width:100%}textarea{min-height:95px;resize:vertical}.tools{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card,.panel{background:white;border-radius:13px;box-shadow:0 4px 14px #22334412;padding:20px}.card{border-left:5px solid var(--dark)}.tag{font-size:12px;color:var(--teal);font-weight:700}.card h3{margin:10px 0}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.detail{margin-top:12px;border-top:1px solid #ddd;padding-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;padding:8px 10px}.panel{margin:18px 0}label{display:block;margin:12px 0 5px;font-weight:600}dialog{border:0;border-radius:14px;width:min(580px,95vw);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 50px #0003}dialog::backdrop{background:#0009}.muted{color:#75818a;font-size:14px}.hidden{display:none!important}#message{min-height:20px;color:#b33}.card img{max-width:100%;max-height:180px;object-fit:contain;border-radius:8px}@media(max-width:600px){.tools{grid-template-columns:1fr}.nav{align-items:stretch;flex-direction:column}}
</style></head><body><main><div class="nav"><a class="button secondary" href="./index.html?from=spot-bilgiler-v4" style="text-decoration:none">← Ana Uygulamaya Dön</a><button id="authBtn" class="secondary">Kullanıcı Girişi</button></div><header><h1>📚 Akupunktur Spot Bilgiler</h1><p class="muted">Kısa ve öz akupunktur eğitim kartları</p></header><div id="adminTools" class="panel hidden"><strong>Kart Yönetimi</strong> <button id="newBtn">+ Yeni Kart Ekle</button> <button id="logoutBtn" class="ghost">Çıkış</button></div><div class="tools"><input id="search" placeholder="🔎 Başlık, bilgi veya kaynak ara..." aria-label="Kart ara"><select id="categoryFilter" aria-label="Kategori"><option value="">Tüm Kategoriler</option></select></div><p id="count" class="muted"></p><p id="message" role="status"></p><div id="cards" class="grid"></div></main>
<dialog id="loginDialog"><form id="loginForm"><h2>Kullanıcı Girişi</h2><label>E-posta<input id="email" type="email" required autocomplete="username"></label><label>Parola<input id="password" type="password" required autocomplete="current-password"></label><p class="muted">Hesabın varsa giriş yap, yoksa ücretsiz kayıt ol.</p><p id="authNotice" class="muted" role="status"></p><div class="actions"><button type="submit">Giriş Yap</button><button type="button" class="secondary" id="openSignup">Kayıt Ol</button><button type="button" class="ghost" id="cancelLogin">İptal</button></div></form></dialog>
<dialog id="signupDialog"><form id="signupForm"><h2>Yeni Hesap Oluştur</h2><p class="muted">Kayıt olan herkes kart ekleyebilir. Yalnızca kendi kartlarını düzenleyebilir ve silebilir.</p><label>E-posta<input id="signupEmail" type="email" required autocomplete="email"></label><label>Şifre (en az 8 karakter)<input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"></label><label>Şifreyi tekrar yaz<input id="signupConfirm" type="password" required minlength="8" autocomplete="new-password"></label><p id="signupNotice" role="status" class="muted"></p><div class="actions"><button id="signupSubmit" type="submit">Hesap Oluştur</button><button type="button" class="ghost" id="cancelSignup">İptal</button></div></form></dialog>
<dialog id="editDialog"><form id="editForm"><h2 id="formHeading">Yeni Spot Kart</h2><input id="cardId" type="hidden"><label>Başlık<input id="title" maxlength="160" required></label><label>Kategori<select id="category" required><option>TCM Temelleri</option><option>Meridyenler</option><option>Akupunktur Noktaları</option><option>Özel Noktalar</option><option>Tanı Bilgileri</option><option>Kulak Akupunkturu</option><option>Diğer</option></select></label><label>Spot bilgi<textarea id="summary" required></textarea></label><label>Detay<textarea id="details"></textarea></label><label>Görsel URL (isteğe bağlı)<input id="imageUrl" type="url" placeholder="https://..."></label><label>Kaynak<input id="source" maxlength="300"></label><div class="actions"><button type="submit">Kaydet</button><button type="button" class="ghost" id="cancelEdit">İptal</button></div></form></dialog>
<script>
const SUPABASE_URL = 'https://erfyniehogwftgvxcufn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-kwcactSSCJmj5VA-Xdleg_8Dt-hSwy';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $=id=>document.getElementById(id);let cards=[],isAdmin=false,currentUser=null;
function msg(s){$('message').textContent=s||''}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function checkAdmin(){const {data:{user}}=await db.auth.getUser();currentUser=user;isAdmin=false;if(user){const {data,error}=await db.from('spot_admins').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!error&&!!data} $('adminTools').classList.toggle('hidden',!user);$('authBtn').textContent=user?'Giriş Yapıldı: '+(user.email||'Kullanıcı'):'Kullanıcı Girişi';render()}
async function load(){const {data,error}=await db.from('spot_cards').select('*').order('created_at',{ascending:false});if(error){msg('Kartlar yüklenemedi: '+error.message);return}cards=data||[];const old=$('categoryFilter').value;const cats=[...new Set(cards.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));$('categoryFilter').replaceChildren(new Option('Tüm Kategoriler',''),...cats.map(c=>new Option(c,c)));$('categoryFilter').value=cats.includes(old)?old:'';msg('');render()}
function render(){const q=$('search').value.toLocaleLowerCase('tr').trim(),cat=$('categoryFilter').value;const visible=cards.filter(c=>(!cat||c.category===cat)&&[c.title,c.summary,c.details,c.source].some(x=>(x||'').toLocaleLowerCase('tr').includes(q)));$('count').textContent=visible.length+' kart';const grid=$('cards');grid.replaceChildren();if(!visible.length){grid.append(el('p','muted','Gösterilecek kart bulunamadı.'));return}for(const c of visible){const article=el('article','card');article.append(el('span','tag',c.category||'Diğer'),el('h3','',c.title),el('p','',c.summary));if(c.image_url){try{const u=new URL(c.image_url);if(['https:','http:'].includes(u.protocol)){const img=el('img');img.src=u.href;img.alt=c.title;img.loading='lazy';article.append(img)}}catch{}}const details=el('div','detail hidden');if(c.details)details.append(el('p','',c.details));if(c.source)details.append(el('p','muted','Kaynak: '+c.source));if(c.details||c.source){const toggle=el('button','ghost','Detayları Göster');toggle.onclick=()=>{details.classList.toggle('hidden');toggle.textContent=details.classList.contains('hidden')?'Detayları Göster':'Detayları Gizle'};article.append(toggle,details)}if(currentUser&&(isAdmin||c.created_by===currentUser.id)){const actions=el('div','actions');const edit=el('button','secondary','Düzenle'),del=el('button','danger','Sil');edit.onclick=()=>editCard(c);del.onclick=()=>deleteCard(c.id);actions.append(edit,del);article.append(actions)}grid.append(article)}}
$('search').oninput=render;$('categoryFilter').onchange=render;
$('authBtn').onclick=()=>{if(!currentUser){$('authNotice').textContent='';$('loginDialog').showModal()}};$('cancelLogin').onclick=()=>$('loginDialog').close();
$('openSignup').onclick=()=>{$('loginDialog').close();$('signupEmail').value=$('email').value.trim();$('signupNotice').textContent='';$('signupDialog').showModal()};
$('cancelSignup').onclick=()=>$('signupDialog').close();
$('signupForm').onsubmit=async e=>{e.preventDefault();const email=$('signupEmail').value.trim(),password=$('signupPassword').value,confirm=$('signupConfirm').value;if(password!==confirm){$('signupNotice').textContent='Şifreler eşleşmiyor.';return}const btn=$('signupSubmit');btn.disabled=true;$('signupNotice').textContent='Hesap oluşturuluyor...';try{const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL('spot-bilgiler.html',location.href).href}});if(error){$('signupNotice').textContent='Kayıt başarısız: '+error.message;return}if(data.session){$('signupDialog').close();$('signupForm').reset();await checkAdmin();msg('Hesap oluşturuldu, giriş yapıldı. Kart ekleyebilirsin.')}else{$('signupNotice').textContent='Kayıt isteği alındı. E-posta doğrulaması etkinse gelen kutundaki bağlantıya tıkla, ardından giriş yap. E-posta gelmezse spam klasörünü kontrol et.'}}finally{btn.disabled=false}};
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('Giriş yapılıyor...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authNotice').textContent='Giriş hatası: '+error.message;msg('');return}$('loginDialog').close();$('password').value='';await checkAdmin();msg(currentUser?'Giriş başarılı. Artık kart ekleyebilirsin.':'Giriş doğrulanamadı.')};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();await checkAdmin();msg('Çıkış yapıldı.')};
$('newBtn').onclick=()=>{if(!currentUser)return;$('editForm').reset();$('cardId').value='';$('formHeading').textContent='Yeni Spot Kart';$('editDialog').showModal()};
$('cancelEdit').onclick=()=>$('editDialog').close();
function editCard(c){if(!currentUser||!(isAdmin||c.created_by===currentUser.id))return;$('cardId').value=c.id;$('title').value=c.title||'';$('category').value=c.category||'Diğer';$('summary').value=c.summary||'';$('details').value=c.details||'';$('imageUrl').value=c.image_url||'';$('source').value=c.source||'';$('formHeading').textContent='Kartı Düzenle';$('editDialog').showModal()}
$('editForm').onsubmit=async e=>{e.preventDefault();if(!currentUser)return;const id=$('cardId').value;const item={title:$('title').value.trim(),category:$('category').value,summary:$('summary').value.trim(),details:$('details').value.trim(),image_url:$('imageUrl').value.trim()||null,source:$('source').value.trim()};if(!item.title||!item.summary)return;const result=id?await db.from('spot_cards').update(item).eq('id',Number(id)):await db.from('spot_cards').insert(item);if(result.error){msg('Kaydetme hatası: '+result.error.message);return}$('editDialog').close();await load()};
async function deleteCard(id){if(!currentUser||!confirm('Bu kart kalıcı olarak silinsin mi?'))return;const {error}=await db.from('spot_cards').delete().eq('id',id);if(error)msg('Silme hatası: '+error.message);else await load()}
db.auth.onAuthStateChange(()=>{setTimeout(()=>{checkAdmin()},0)});(async()=>{await checkAdmin();await load()})();
</script></body></html>
